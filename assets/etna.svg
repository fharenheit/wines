<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" width="880" height="660" role="img"><rect width="100%" height="100%" fill="#faf7f2"/>
<text x="20" y="28" font-size="18" font-weight="700" fill="#2f2a24" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">에트나 — 사면별 콘트라다(Contrade)</text>
<text x="20" y="48" font-size="12.5" fill="#6b6157" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">Etna DOC : 화산 사면을 둘러싼 133개 콘트라다 · 부르고뉴식 단일 구획 표기 체계</text>
<circle cx="440" cy="320" r="186" fill="#8a7f72" opacity="0.16"/>
<circle cx="440" cy="320" r="148" fill="#8a7f72" opacity="0.26"/>
<circle cx="440" cy="320" r="92" fill="#8a7f72" opacity="0.40"/>
<circle cx="440" cy="320" r="26" fill="#5a4f45"/>
<text x="440" y="324" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">분화구</text>
<text x="440" y="336" font-size="9.5" fill="#d9cfc4" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">3,357 m</text>
<text x="440" y="92" font-size="13.5" font-weight="700" fill="#8c2f39" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">북 사면 Nord</text>
<text x="440" y="109" font-size="11" fill="#2f2a24" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">Guardiola · Rampante · Santo Spirito · Calderara Sottana · Feudo di Mezzo</text>
<text x="440" y="125" font-size="10.5" fill="#6b6157" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">가장 유명 · 고도 600~1,000 m</text>
<text x="440" y="139" font-size="10.5" fill="#6b6157" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">서늘하고 섬세 · 최고가 콘트라다 밀집</text>
<text x="862" y="300" font-size="13.5" font-weight="700" fill="#a05a3a" text-anchor="end" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">동 사면 Est</text>
<text x="862" y="317" font-size="11" fill="#2f2a24" text-anchor="end" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">Milo · Praino · Caselle · Villagrande</text>
<text x="862" y="333" font-size="10.5" fill="#6b6157" text-anchor="end" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">이오니아해 영향 · 강수량 최다</text>
<text x="862" y="347" font-size="10.5" fill="#6b6157" text-anchor="end" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">카리칸테 화이트 (Bianco Superiore는 밀로만)</text>
<text x="440" y="532" font-size="13.5" font-weight="700" fill="#7a5a8a" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">남서 사면 Sud-Ovest</text>
<text x="440" y="549" font-size="11" fill="#2f2a24" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">Biancavilla · Santa Maria di Licodia · Contrada Cavaliere</text>
<text x="440" y="565" font-size="10.5" fill="#6b6157" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">따뜻하고 풍만 · 재평가 진행 중</text>
<text x="18" y="300" font-size="13.5" font-weight="700" fill="#5b7f4f" text-anchor="start" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">서 사면 Ovest</text>
<text x="18" y="317" font-size="11" fill="#2f2a24" text-anchor="start" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">Bronte · Contrada Nave</text>
<text x="18" y="333" font-size="10.5" fill="#6b6157" text-anchor="start" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">가장 고지대 · 최근 개발</text>
<rect x="20" y="594" width="840" height="52" fill="#ffffff" fill-opacity="0.92" stroke="#c4b8a3" rx="4"/>
<text x="34" y="615" font-size="11.5" fill="#2f2a24" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"><tspan font-weight="700">레드</tspan> 네렐로 마스칼레제(주) + 네렐로 카푸초   ·   <tspan font-weight="700">화이트</tspan> 카리칸테 + 카타라토</text>
<text x="34" y="633" font-size="11" fill="#6b6157" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">용암류·화산재가 층층이 쌓여 콘트라다마다 토양 연대가 달라진다 — 같은 품종이라도 구획별 성격 차이가 크다</text>
</svg>